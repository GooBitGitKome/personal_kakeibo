name: PersonalKakeibo
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
targets:
  PersonalKakeiboDomain:
    type: framework
    platform: iOS
    sources: [PersonalKakeibo/Domain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PersonalKakeibo.Domain
        GENERATE_INFOPLIST_FILE: YES
  PersonalKakeiboApplication:
    type: framework
    platform: iOS
    sources: [PersonalKakeibo/Application]
    dependencies:
      - target: PersonalKakeiboDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PersonalKakeibo.Application
        GENERATE_INFOPLIST_FILE: YES
  PersonalKakeibo:
    type: application
    platform: iOS
    sources:
      - PersonalKakeibo/App
      - PersonalKakeibo/Infrastructure
      - PersonalKakeibo/Presentation
    dependencies:
      - target: PersonalKakeiboDomain
      - target: PersonalKakeiboApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PersonalKakeibo
        DEVELOPMENT_TEAM: T8B5CZ9PVH
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 家計簿
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
